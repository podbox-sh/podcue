name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv run --python ${{ matrix.python }} pytest -m "not slow" --ignore tests/test_smoke.py --ignore tests/test_start_en.py --ignore tests/test_build_en.py --ignore tests/test_start_long.py

  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install ffmpeg and espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Start a short clip with built-in ASR and with --transcript
        env:
          PODCUE_LIVE_EN: "1"
        run: uv run --python 3.12 --extra asr pytest tests/test_start_en.py -s -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install ffmpeg and espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/podcue
          key: podcue-kokoro-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: podcue-kokoro-
      - name: Build a recap with Kokoro narration and a clip
        env:
          PODCUE_LIVE_EN: "1"
        run: uv run --python 3.12 --extra recap pytest tests/test_build_en.py -s -q

  # Same steps as .cursor/skills/verify-podcue. Runs on every pull request and on main.
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install ffmpeg and espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/podcue
          key: podcue-models-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            podcue-models-
            podcue-kokoro-
      - name: Lock mutual exclusion
        run: uv run --python 3.12 pytest tests/test_locks.py -s -q
      - name: Run verify-podcue
        run: python3 .cursor/skills/verify-podcue/drive.py
      - name: Start several minutes of tones and silence
        env:
          PODCUE_LIVE_EN: "1"
        run: uv run --python 3.12 --extra asr pytest tests/test_start_long.py -s -q
